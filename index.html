<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PaperPal</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">

</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg bg-white border-bottom mb-4">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">PaperPal</a>
    </div>
  </nav>

  <main class="container mb-5" >
    <!-- Step 1: choose number of questions -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h1 class="h4 mb-3">How many questions?</h1>
        <div class="row g-3 align-items-end">
          <div class="col-12 col-md-4">
            <label for="questionCount" class="form-label">Number of questions</label>
            <input type="number" id="questionCount" class="form-control" min="1" max="100" placeholder="e.g. 5" required>
            <div class="form-text">You can regenerate later if needed.</div>
          </div>
          <div class="col-12 col-md-4">
            <button id="generateBtn" type="button" class="btn btn-primary">Continue</button>
            <button id="clearBtn" type="button" class="btn btn-outline-secondary ms-2">Clear</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Step 2 + 3: the dynamic form that posts to PHP -->
    <form id="examForm" class="card shadow-sm" method="post" action="generate.php" enctype="multipart/form-data" target="_blank">
      <div class="card-body">
        <h2 class="h4 mb-3">Enter questions</h2>
        <p class="text-muted mb-4">Each question can include text, image, marks and how many lines of answer space you want.</p>

        <div id="questionsContainer" class="vstack gap-3"></div>

        <hr class="my-4">
        <div class="d-flex justify-content-between align-items-center">
          <div class="text-muted small">On submit, the qustions wil be transform into pdf</div>
          <button id="submitBtn" type="submit" class="btn btn-success" disabled>
            Generate PDF
          </button>
        </div>
      </div>
    </form>
  </main>

  <!-- Toast for small notifications -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
    <div id="toast" class="toast align-items-center text-bg-primary border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body" id="toastBody">Ready.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
